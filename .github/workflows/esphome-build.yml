name: ESPHome Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install esphome

      - name: Compile ESPHome YAML
        run: esphome compile esp32_flight_radar_jc1060p470c.yaml
