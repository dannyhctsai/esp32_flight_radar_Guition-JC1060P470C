name: ESPHome Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Compile ESPHome YAML
        run: esphome compile radar-p4-7b_Guition-JC1060P470.yaml

      - name: Upload Firmware Bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .esphome/build/esp32-flight-radar-jc1060p470c/.pio/build/esp32-flight-radar-jc1060p470c/firmware.bin
          if-no-files-found: ignore
