name: Build ESPHome Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: 'delphicchen/esp32_flight_radar'
          ref: 'lvgl9'
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          pip install --upgrade pip
          pip install 'esphome==2026.6.*'

      - name: Compile ESPHome project
        run: |
          esphome compile radar-p4-7b.yaml

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            .esphome/build/radar-p4-7b/.pio/build/radar-p4-7b/*.bin
            .esphome/build/radar-p4-7b/.pio/build/radar-p4-7b/*.elf
